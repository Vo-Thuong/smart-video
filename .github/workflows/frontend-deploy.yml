name: Deploy Frontend to Render

on:
  push:
    branches: [main, dev-rin] # Thay bằng master nếu bạn dùng nhánh master
    paths:
      - "frontend-new/**" # Chỉ chạy khi có thay đổi trong thư mục frontend-new

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          echo "Kích hoạt Render Deploy Hook cho Frontend..."
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
